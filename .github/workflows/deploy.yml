name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Configure SSH and Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Set up SSH directory and key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add remote host to known_hosts to bypass connection prompt
          ssh-keyscan -H ssh.hellocode.be >> ~/.ssh/known_hosts
          
          # Deploy files using rsync
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.example' \
            ./ hellocodebe@ssh.hellocode.be:subsites/fullstack.be/
            
          # Run post-deployment script on the server
          ssh -i ~/.ssh/id_rsa hellocodebe@ssh.hellocode.be "bash subsites/fullstack.be/postdeploy.sh"
